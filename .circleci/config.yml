version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.3
  aws-ecr: circleci/aws-ecr@9.0.4
  docker: circleci/docker@2.2.0
  jq: circleci/jq@3.0.0
  mcd-tools: monte-carlo/mcd-ci-tools@1.11.0

commands:
  verify-version-in-docker-image:
    parameters:
      image:
        description: Image name to validate
        type: string
      version:
        description: Expected contents for /app/apollo/agent/version file
        type: string
    steps:
    - run:
        name: Verify version in Docker image
        command: |
          image_version=$(docker run --rm --entrypoint python << parameters.image >> apollo/agent/settings.py)
          if [ $image_version = "<< parameters.version >>" ]
            then exit 0
            else echo "Failed to find expected version, found: $image_version"; exit 1
          fi
  generate-version-number-dev:
    steps:
    - run:
        command: |
          PIPELINE_NUMBER=<< pipeline.number >>
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else exit 1; fi
          VERSION=${TAG#v}
          echo "NEXT_VERSION=$(echo "$VERSION" | awk 'BEGIN{FS=OFS="."} {$3+=1} 1')rc${PIPELINE_NUMBER}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate dev version number
  generate-version-number-prod:
    steps:
    - run:
        command: |
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else exit 1; fi
          echo "VERSION_TAG=${TAG#v}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate prod version number
  setup-buildx:
    parameters:
      set_default:
        description: Make the builder the default; otherwise pass --builder explicitly
        type: boolean
        default: true
    steps:
    # Attestations (SBOM + SLSA provenance) require the docker-container
    # buildx driver — the default docker driver writes single manifests, not
    # the OCI image index that holds attestation manifests alongside the
    # platform image.
    - when:
        condition: << parameters.set_default >>
        steps:
        - run:
            name: Set up buildx (docker-container driver)
            command: |
              docker buildx create --use --name apollo-builder --driver docker-container
              docker buildx inspect --bootstrap
    - unless:
        condition: << parameters.set_default >>
        steps:
        - run:
            name: Set up buildx (docker-container driver, not default)
            command: |
              docker buildx create --name apollo-builder --driver docker-container
              docker buildx inspect --builder apollo-builder --bootstrap

  # Copied from monte-carlo-data/mc-security .circleci/vuln-image-scan.yml (SEC-3726).
  # Keep in sync with that file; docs: vuln-mgmt-scanner/Centralized_Docker_Scanning.md.
  mc-vuln-image-scan:
    description: >
      Scan a Docker image with mc-security's centralized scanner (Trivy, plus Wiz/Aikido/Scout when
      their credentials are set), store the reports as artifacts, then apply the gate. Needs a job
      that requires fetch-mc-security-scanner and has a Docker daemon (machine executor or
      setup_remote_docker).
    parameters:
      image:
        type: string
        description: Image(s) to scan, space-separated. Env vars such as ${VERSION_TAG} are expanded.
      severity:
        type: string
        default: "CRITICAL,HIGH"
        description: Severity filter, which is also the gate threshold.
      customer_cves:
        type: string
        default: ""
        description: Comma-separated customer-reported CVE IDs to cross-reference.
      scanners:
        type: string
        default: ""
        description: Subset of trivy,scout,wiz,aikido. Empty runs every scanner that has credentials.
      fail_on_findings:
        type: boolean
        default: false
        description: Fail the job when the scan finds anything or doesn't complete. Off is warn mode.
      local_image:
        type: boolean
        default: true
        description: >
          Scan the copy in the local Docker daemon (build with --load first). Turn off only to scan
          an image already in a registry.
      workspace_root:
        type: string
        default: /tmp/mc-security-workspace
      output_dir:
        type: string
        default: /tmp/mc-security-scan-results
        description: Kept outside the checkout so reports never enter a `docker build .` context.
    steps:
      - attach_workspace:
          at: << parameters.workspace_root >>
      - run:
          name: Install image scanners (pinned)
          # In warn mode a download outage must not block a release: the scan then records
          # "error" and the gate warns. With the gate on it fails here.
          command: |
            if ! bash "<< parameters.workspace_root >>/mc-security-scanner/ci/install-scanners.sh"; then
              echo "[WARNING] Scanner install failed; the scan will record an error."
              [ "<< parameters.fail_on_findings >>" != true ] || exit 1
            fi
      - run:
          name: Vulnerability scan (mc-security)
          environment:
            SCAN_SEVERITY: << parameters.severity >>
            SCAN_CUSTOMER_CVES: << parameters.customer_cves >>
            SCAN_SCANNERS: << parameters.scanners >>
            SCAN_LOCAL_IMAGE: << parameters.local_image >>
            SCAN_OUTPUT_DIR: << parameters.output_dir >>
          command: |
            echo "mc-security scanner at $(cat "<< parameters.workspace_root >>/mc-security-scanner/MC_SECURITY_SHA")"
            SCAN_IMAGES="<< parameters.image >>" \
              bash "<< parameters.workspace_root >>/mc-security-scanner/ci/ci-scan.sh" scan
      - store_artifacts:
          path: << parameters.output_dir >>
          destination: vuln-image-scan
      - run:
          name: Enforce vulnerability gate
          environment:
            SCAN_FAIL_ON_FINDINGS: << parameters.fail_on_findings >>
            SCAN_SEVERITY: << parameters.severity >>
            SCAN_OUTPUT_DIR: << parameters.output_dir >>
          command: bash "<< parameters.workspace_root >>/mc-security-scanner/ci/ci-scan.sh" gate

jobs:
  # Copied from monte-carlo-data/mc-security .circleci/vuln-image-scan.yml (SEC-3726).
  # Keep in sync with that file; docs: vuln-mgmt-scanner/Centralized_Docker_Scanning.md.
  fetch-mc-security-scanner:
    description: >
      Fetch mc-security's scanner scripts at one commit and persist them to the workspace. Run with
      the "GitHub PR Manager" context; give it the same branch/tag filters as the jobs that need it.
    parameters:
      mc_security_ref:
        type: string
        default: main
        description: >
          mc-security commit SHA (preferred), tag or branch. Pin a SHA so the code that runs next to
          your push credentials can't change under you.
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - mcd-tools/mint-github-token:
          output_var: MC_SECURITY_TOKEN
          repositories: '["mc-security"]'
          permissions: '{"contents":"read"}'
      - run:
          name: Fetch scanner scripts from mc-security
          environment:
            MC_SECURITY_REF: << parameters.mc_security_ref >>
          command: |
            set +x
            dest=/tmp/mc-security-workspace/mc-security-scanner
            api=https://api.github.com/repos/monte-carlo-data/mc-security
            mkdir -p "${dest}/ci"
            # The token goes to curl on stdin, never argv (visible in /proc/<pid>/cmdline).
            gh_get() {
              printf 'Authorization: Bearer %s\n' "${MC_SECURITY_TOKEN}" \
                | curl -fsSL --retry 3 -H @- -H "Accept: $1" "$2"
            }
            # Resolve the ref once so every file comes from the same commit.
            sha="$(gh_get application/vnd.github.sha "${api}/commits/${MC_SECURITY_REF}")"
            for path in \
                vuln-mgmt-scanner/scan-image.sh \
                vuln-mgmt-scanner/ci/ci-scan.sh \
                vuln-mgmt-scanner/ci/install-scanners.sh; do
              gh_get application/vnd.github.raw "${api}/contents/${path}?ref=${sha}" \
                > "${dest}/${path#vuln-mgmt-scanner/}"
            done
            echo "${sha}" > "${dest}/MC_SECURITY_SHA"
            echo "Fetched mc-security scanner at ${sha} (ref: ${MC_SECURITY_REF})"
      - persist_to_workspace:
          root: /tmp/mc-security-workspace
          paths:
            - mc-security-scanner

  build-ok:
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Message
          command: |
            echo "OK"

  run-linter:
    docker:
      - image: cimg/python:3.13-node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --no-cache-dir --upgrade pip
            pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt -r requirements-cloudrun.txt -r requirements-lambda.txt -r requirements-azure.txt
      - run:
          name: 'Run black / pyright'
          command: |
            . .venv/bin/activate
            black --check .
            pyright

  run-test-docker:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - docker/build:
          image: mcd/apollo-agent-tests
          extra_build_args: --target tests
          step-name: Run tests in docker build

  # The azure image is the only one on Python 3.14 (its base is the sole non-EOL
  # variant Microsoft publishes — see the azure stage in the Dockerfile), so the
  # suite is run a second time against that interpreter and its resolved deps.
  run-test-docker-azure:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - docker/build:
          image: mcd/apollo-agent-tests-azure
          extra_build_args: --target tests-azure
          step-name: Run tests in docker build (azure, Python 3.14)

  # system-base and oracle-pki are published for downstream consumers (e.g. hermes-agent),
  # not for the golden agents, so they run on dev and v* tags but not in the merge queue.
  build-and-push-base-images:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
    steps:
      - checkout
      # arm64 emulation for the multi-arch oracle-pki build. Pinned, and run
      # before docker/check (the registry login) so this privileged third-party
      # image never sees the push credentials.
      - run:
          name: Register QEMU for arm64 builds
          command: |
            docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - docker/check:
          use-docker-credentials-store: true
      - setup-buildx
      # Publish the `system-base` stage (apt-only, no venv, no apollo source) as
      # `<version>-system-base`. Downstream consumers (e.g. hermes-agent) build
      # their own venv on top against the same native libs without inheriting
      # apollo's pip-installed Python deps. No version check — system-base has
      # no apollo/agent/version file, so it goes straight to push.
      - run:
          name: Build and push system-base with SBOM + SLSA provenance
          command: |
            docker buildx build \
              --target system-base \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-system-base \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:<< parameters.code_version >>-system-base \
              --sbom=true \
              --provenance=mode=max \
              --push \
              .
      # Publish `/opt/oracle-pki` alone as a multi-arch `<version>-oracle-pki`
      # image, so arm64 consumers can `COPY --from` it (system-base is
      # amd64-only). The arm64 half builds under QEMU; it's only jlink + curl.
      - run:
          name: Build and push multi-arch oracle-pki with SBOM + SLSA provenance
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target oracle-pki \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-oracle-pki \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:<< parameters.code_version >>-oracle-pki \
              --sbom=true \
              --provenance=mode=max \
              --push \
              .

  # One job per image target so each golden agent waits only for its own image.
  build-and-push-image:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
      target:
        description: Dockerfile stage to build
        type: string
      tag_suffix:
        description: Tag suffix, as in <version>-<tag_suffix> and latest-<tag_suffix>
        type: string
      alias_tag_suffix:
        description: Optional legacy suffix also pushed for the same image, kept for back-compat
        type: string
        default: ""
      verify_azure_startup:
        type: boolean
        default: false
      vuln_scan:
        description: Scan the local build with mc-security's scanner before pushing (needs fetch-mc-security-scanner)
        type: boolean
        default: false
    steps:
      - checkout
      - docker/check:
          use-docker-credentials-store: true
      - setup-buildx
      # Built twice: --load so the image can be run and checked before publishing, then --push
      # with SBOM + provenance. They can't be combined (the daemon can't load an OCI index with
      # attestations); BuildKit cache makes the second pass cheap.
      - run:
          name: Build << parameters.target >> image (local) for version verification
          command: |
            docker buildx build \
              --target << parameters.target >> \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-<< parameters.tag_suffix >> \
              --load \
              .
      - verify-version-in-docker-image:
          image: montecarlodata/<< parameters.docker_hub_repository >>:latest-<< parameters.tag_suffix >>
          version: << parameters.code_version >>,<< pipeline.number >>
      - when:
          condition: << parameters.verify_azure_startup >>
          steps:
            # A host that can't start or an app that can't import leaves a deployed agent returning 503
            # and unable to upgrade itself. Exit 124 means timeout stopped a still-running host (success).
            - run:
                name: Verify Azure Functions host and app start
                command: |
                  rc=0
                  docker run --rm montecarlodata/<< parameters.docker_hub_repository >>:latest-<< parameters.tag_suffix >> timeout 30 /opt/startup/start_nonappservice.sh || rc=$?
                  if [ "$rc" -ne 124 ]; then echo "Functions host exited with code $rc instead of staying up"; exit 1; fi
                  # Dummy connection string: the app won't import without one.
                  docker run --rm -e APPLICATIONINSIGHTS_CONNECTION_STRING="InstrumentationKey=00000000-0000-0000-0000-000000000000" \
                    --entrypoint sh montecarlodata/<< parameters.docker_hub_repository >>:latest-<< parameters.tag_suffix >> \
                    -c 'cd /home/site/wwwroot && python -c "import function_app"'
      # Warn mode: findings are reported in the log and the vuln-image-scan artifacts, and the
      # push still happens. Set fail_on_findings: true to block publishing vulnerable images.
      - when:
          condition: << parameters.vuln_scan >>
          steps:
            - mc-vuln-image-scan:
                image: montecarlodata/<< parameters.docker_hub_repository >>:latest-<< parameters.tag_suffix >>
      - run:
          name: Build and push << parameters.target >> with SBOM + SLSA provenance
          command: |
            image=montecarlodata/<< parameters.docker_hub_repository >>
            alias_tags=""
            if [ -n "<< parameters.alias_tag_suffix >>" ]; then
              alias_tags="--tag $image:latest-<< parameters.alias_tag_suffix >> --tag $image:<< parameters.code_version >>-<< parameters.alias_tag_suffix >>"
            fi
            docker buildx build \
              --target << parameters.target >> \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag $image:latest-<< parameters.tag_suffix >> \
              --tag $image:<< parameters.code_version >>-<< parameters.tag_suffix >> \
              $alias_tags \
              --sbom=true \
              --provenance=mode=max \
              --push \
              .

  build-and-push-lambda:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      aws_ecr_repository:
        type: string
      code_version:
        type: string
    steps:
      - checkout
      - docker/check:
          use-docker-credentials-store: true
      # Not the default builder: the classic `docker build` the ECR step runs must keep the
      # docker driver to produce the single-manifest image Lambda requires.
      - setup-buildx:
          set_default: false
      - run:
          name: Build and push lambda (Docker Hub) with SBOM + SLSA provenance
          command: |
            docker buildx build \
              --builder apollo-builder \
              --target lambda \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-lambda \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:<< parameters.code_version >>-lambda \
              --sbom=true \
              --provenance=mode=max \
              --push \
              .
      # ECR copy: rebuild with --provenance=false. AWS Lambda / CloudFormation
      # reject the OCI image index that BuildKit emits when attestations are
      # attached ("image manifest, config or layer media type ... is not
      # supported"), so the ECR image must be a plain single-arch manifest.
      # BuildKit cache means the second build is nearly free.
      - docker/build:
          step-name: Build lambda image (ECR, no attestations)
          use-buildkit: true
          extra_build_args: --target lambda --build-arg code_version=<< parameters.code_version >> --build-arg build_number=<< pipeline.number >> --provenance=false
          registry: ${AWS_ECR_ACCOUNT_URL}
          image: << parameters.aws_ecr_repository >>
          tag: latest,<< parameters.code_version >>
      - verify-version-in-docker-image:
          image: ${AWS_ECR_ACCOUNT_URL}/<< parameters.aws_ecr_repository >>:<< parameters.code_version >>
          version: << parameters.code_version >>,<< pipeline.number >>
      - aws-cli/setup:
          role_arn: "${AWS_ROLE_ARN}"
      - aws-ecr/ecr_login
      - aws-ecr/push_image:
          repo: << parameters.aws_ecr_repository >>
          tag: latest,<< parameters.code_version >>
  push-lambda-legacy-repo:
    machine:
      image: ubuntu-2204:current
    parameters:
      aws_ecr_repository:
        type: string
      code_version:
        type: string
    steps:
      - checkout
      # Build a fresh lambda image with --provenance=false for the legacy ECR.
      # Previously this job pulled the Docker Hub image and re-pushed, but
      # that image now ships as an OCI index with a provenance attestation
      # manifest that AWS Lambda / CloudFormation reject. Rebuilding here
      # keeps the ECR copy as a plain single-arch manifest.
      - docker/build:
          step-name: Build lambda image (legacy ECR, no attestations)
          use-buildkit: true
          extra_build_args: --target lambda --build-arg code_version=<< parameters.code_version >> --build-arg build_number=<< pipeline.number >> --provenance=false
          registry: ${AWS_ECR_ACCOUNT_URL}
          image: << parameters.aws_ecr_repository >>
          tag: latest,<< parameters.code_version >>
      - aws-ecr/ecr_login
      - aws-ecr/push_image:
          repo: << parameters.aws_ecr_repository >>
          tag: latest,<< parameters.code_version >>

  build-and-push-docs:
    docker:
      - image: python:3.13
    parameters:
      code_version:
        type: string
    steps:
      - checkout
      - aws-cli/install
      - aws-cli/setup:
          profile_name: default
      - run:
          name: Install dependencies
          command: |
            pip install virtualenv==20.35.4
            pip install --upgrade pip
      - run:
          name: Publish docs and invalidate the cloudfront cache
          command: make VERSION=<< parameters.code_version >> publish-docs

  update-and-validate-golden-agent:
    executor:
      name: aws-cli/default
      tag: current-22.04
    parameters:
      use_aws_cli:
        description: Use the AWS CLI to perform the update
        type: boolean
        default: false
      agent_uuid:
        description: UUID of the Agent
        type: string
      agent_version:
        description: The agent version installed, to check after the upgrade is complete
        type: string
      initial_wait_seconds:
        description: Seconds to wait before the first health poll (Azure upgrades are async)
        type: integer
        default: 0
      version_wait_seconds:
        description: How long to keep polling agent health for the new version after the update
        type: integer
        default: 300
      image_repo:
        description: The image repository to use for the agent, pre-release-agent or agent
        type: string
        default: "agent"
      image_variant:
        description: Image tag suffix for the agent's platform; required unless use_aws_cli
        type: enum
        enum: ["", "azure", "cloudrun", "lambda"]
        default: ""
      ecr_repo_name:
        description: The ECR repository to use for the AWS CLI update
        type: string
        default: "${AWS_AGENT_ECR_REPO_PROD}"
      ecr_repo_account:
        description: The AWS account to use for the ECR repo update
        type: string
        default: "${AWS_AGENT_ECR_ACCOUNT_PROD}"
    steps:
      - jq/install
      - run:
          name: Install dependencies
          command: |
            curl https://bootstrap.pypa.io/get-pip.py > get-pip.py
            python get-pip.py
            pip install --no-cache-dir --upgrade pip
            pip install --no-cache-dir montecarlodata
      - when:
          condition:
            equal: [ true, << parameters.use_aws_cli >> ]
          steps:
            - aws-cli/setup:
                role_arn: "${AWS_AGENT_ACCOUNT_ROLE_ARN}"
                profile_name: mcd
            - run:
                name: Trigger AWS agent stack update
                command: |
                  aws cloudformation update-stack --profile mcd --stack-name "${AWS_AGENT_STACK_NAME}" --use-previous-template --parameters "ParameterKey=ImageUri,ParameterValue=<< parameters.ecr_repo_account >>.dkr.ecr.*.amazonaws.com/<< parameters.ecr_repo_name >>:<< parameters.agent_version >>" --region ${AWS_AGENT_REGION} --capabilities CAPABILITY_IAM
            - run:
                name: Wait for update to complete
                command: |
                  aws cloudformation wait stack-update-complete --profile mcd --stack-name "${AWS_AGENT_STACK_NAME}" --region ${AWS_AGENT_REGION}
      - when:
          condition:
            not: << parameters.use_aws_cli >>
          steps:
            - run:
                name: Update agent
                # Pin the tag: without --image-tag the CLI installs the repo's most recently
                # pushed tag, which may belong to a concurrent dev or merge-queue build.
                command: |
                  if [ -z "<< parameters.image_variant >>" ]; then echo "image_variant is required"; exit 1; fi
                  export MCD_DEFAULT_API_ID=${MCD_SMOKE_TESTS_API_ID}
                  export MCD_DEFAULT_API_TOKEN=${MCD_SMOKE_TESTS_API_TOKEN}
                  export MCD_AGENT_IMAGE_REPO=<< parameters.image_repo >>
                  montecarlo agents upgrade --agent-id << parameters.agent_uuid >> \
                    --image-tag "<< parameters.agent_version >>-<< parameters.image_variant >>"
      - run:
          name: Run Agent Health - Validate version
          # Poll rather than sleep: a restarting agent (e.g. Azure) can report the old version or fail
          # health for a while. Azure gets an initial wait because its upgrade is async. Only the
          # version field is printed; health output can include secrets.
          command: |
            export MCD_DEFAULT_API_ID=${MCD_SMOKE_TESTS_API_ID}
            export MCD_DEFAULT_API_TOKEN=${MCD_SMOKE_TESTS_API_TOKEN}
            if [ -z "<< parameters.agent_version >>" ]; then echo "agent_version is empty"; exit 1; fi
            sleep << parameters.initial_wait_seconds >>
            err=$(mktemp)
            deadline=$((SECONDS + << parameters.version_wait_seconds >>))
            while true; do
              AGENT_VERSION=$(montecarlo agents health --agent-id << parameters.agent_uuid >> 2>"$err" | grep -v "Agent health check" | jq -r '.version' 2>/dev/null) || AGENT_VERSION=""
              echo "Agent Version: $AGENT_VERSION"
              if [ -n "$AGENT_VERSION" ] && [ "$AGENT_VERSION" = "<< parameters.agent_version >>" ]; then exit 0; fi
              if [ $SECONDS -ge $deadline ]; then
                echo "Failed to find expected version (<< parameters.agent_version >>), found: $AGENT_VERSION"
                echo "Last CLI error output:"; tail -5 "$err"; exit 1
              fi
              sleep 15
            done
      - run:
          name: Run validations
          command: |
            export MCD_DEFAULT_API_ID=${MCD_SMOKE_TESTS_API_ID}
            export MCD_DEFAULT_API_TOKEN=${MCD_SMOKE_TESTS_API_TOKEN}
            montecarlo collectors run-validations --only-periodic --agent-id << parameters.agent_uuid >>

workflows:
  version: 2

  build-and-deploy:
    jobs:
      - run-linter
      # Same branch/tag coverage as the Azure image jobs that require it. Mints a read-only
      # mc-security token, so the repo must be allowed on the GitHub PR Manager context.
      - fetch-mc-security-scanner:
          # mc-security merge of SEC-3726 (mc-security#1064). Bump deliberately; don't track main.
          mc_security_ref: d25ff437db0fa2b25bda0900523404b711a921d5
          context:
            - GitHub PR Manager
          filters:
            branches:
              only:
                - dev
                - /.*\/pr-.*/
            tags:
              only: /^v.*/
      - run-test-docker:
