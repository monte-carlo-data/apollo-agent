# Setup config (CircleCI dynamic config; needs "Enable dynamic config using setup
# workflows" in the project settings). Every pipeline, including tags and merge-queue
# branches, starts here: the setup job renders .circleci/continue_config.yml, which
# holds all the real jobs, and continues the pipeline with it.
#
# On feature branches it keeps the image-check-<target> jobs only when packaging
# changed, for the targets the impact map selects (all four if the map is missing or
# fails). Tags, dev, main and the merge queue get none: their build jobs check every
# image they build. See docs/image-contract-tests.md.
version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@2.0.1

jobs:
  setup:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select image checks and render the pipeline config
          command: |
            python3 scripts/image_checks/pipeline_setup.py \
              --template .circleci/continue_config.yml \
              --out /tmp/continue_config.yml \
              --checklist /tmp/impact_checklist.md
      - run:
          # Advisory only: the script exits 0 on any problem, including a missing token.
          name: Post the impact map's manual checklist on the PR
          command: python3 scripts/image_checks/pr_comment.py --body-file /tmp/impact_checklist.md
      - continuation/continue:
          configuration_path: /tmp/continue_config.yml

workflows:
  setup:
    jobs:
      - setup:
          # Without a tag filter a setup workflow never runs for tags, so v* releases
          # would never reach the continuation config.
          filters:
            tags:
              only: /.*/
