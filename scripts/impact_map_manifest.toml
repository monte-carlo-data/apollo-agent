# Impact-map manifest, read by scripts/impact_map.py. How to maintain it: docs/impact-map.md.
#
# tests/test_impact_map_manifest.py checks that every package in a requirements*.in file has
# an entry under [packages], that every requirements*.txt is mapped to the image targets the
# Dockerfile installs it into, and that every connection type used here is in
# [connection_types].

# Files whose change counts as a packaging change. Any other change (e.g. apollo/ code)
# gives `packaging_changed: false`.
packaging_paths = [
  "requirements*.txt",
  "requirements*.in",
  "Dockerfile",
  ".dockerignore",
  "resources/*",
]

# A change to any of these affects every image: all targets and all platforms (fail-open).
fail_open_paths = [
  "Dockerfile",
  ".dockerignore",
  "resources/*",
]

# Image target -> platforms its standing test agent runs on. `aws_proxied` is `generic` with a
# different CMD and is checked inside the `generic` image, so it is never listed. `generic` has
# no standing test agent.
[targets]
generic = []
cloudrun = ["gcp"]
lambda = ["aws"]
azure = ["azure"]

# Compiled requirements file -> image targets that install it (from the Dockerfile).
# requirements-dev.txt only goes into the `tests` / `tests-azure` stages, which are not shipped.
[requirements_files]
"requirements.txt" = ["generic", "cloudrun", "lambda", "azure"]
"requirements-cloudrun.txt" = ["cloudrun"]
"requirements-lambda.txt" = ["lambda"]
"requirements-azure.txt" = ["azure"]
"requirements-dev.txt" = []

# Connection types, as the Monte Carlo REST API v2 names them (`GET /connection-types`,
# also used by the apollo-agent-dev-smoke-test skill), with the collection areas each one
# supports. Areas come from the type's job types: metadata / etl / reports ->
# metadata_collection, query_logs -> query_logs, sql_query -> monitors.
[connection_types]
athena = ["query_logs", "monitors"]
azure-dedicated-sql-pool = ["metadata_collection", "monitors"]
azure-sql-database = ["metadata_collection", "monitors"]
bigquery = ["metadata_collection", "query_logs", "monitors"]
clickhouse = ["metadata_collection", "query_logs", "monitors"]
databricks-metastore-sql-warehouse = ["metadata_collection", "query_logs"]
databricks-sql-warehouse = ["monitors"]
db2 = ["metadata_collection", "monitors"]
dremio = ["metadata_collection", "monitors"]
fivetran = ["metadata_collection"]
gcp-dataform = ["metadata_collection"]
glue = ["metadata_collection"]
hive = ["monitors"]
hive-mysql = ["metadata_collection"]
hive-s3 = ["query_logs"]
informatica-v2 = ["metadata_collection"]
looker = ["metadata_collection"]
looker-git-clone = ["metadata_collection"]
mariadb = ["metadata_collection", "monitors"]
microsoft-fabric = ["metadata_collection", "monitors"]
motherduck = ["metadata_collection", "monitors"]
mulesoft = ["metadata_collection"]
mysql = ["metadata_collection", "monitors"]
oracle = ["metadata_collection", "monitors"]
postgres = ["metadata_collection", "monitors"]
power-bi = ["metadata_collection"]
presto = ["monitors"]
redshift = ["metadata_collection", "query_logs", "monitors"]
s3 = []
salesforce-crm = ["metadata_collection", "monitors"]
salesforce-data-cloud = ["metadata_collection", "monitors"]
sap-hana = ["metadata_collection", "monitors"]
snowflake = ["metadata_collection", "query_logs", "monitors"]
sql-server = ["metadata_collection", "monitors"]
starburst-enterprise = ["metadata_collection", "monitors"]
starburst-galaxy = ["metadata_collection", "monitors"]
tableau = ["metadata_collection"]
teradata = ["metadata_collection", "query_logs", "monitors"]

# apollo/ source paths -> what they serve. A key ending in "/" covers the directory; the
