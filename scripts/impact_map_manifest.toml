# Every package named in a requirements*.in file. Keys are PEP 503 names.
#   scope            direct     - apollo uses it for specific connection types or paths
#                    runtime    - platform/runtime-wide (web server, framework, agent base);
#                                 the image checks and each agent's health check cover it
#                    transitive - pinned only to force a version (security, wheels); the
#                                 mapping comes from the packages that pull it in (`# via`)
#                    dev        - tests/lint only, never in a shipped image
#   connection_types REST v2 connection types it serves (on top of what import scanning finds)
#   imports          module names to look for in apollo/ (default: the name with - -> _);
#                    [] turns scanning off
#   areas            when THIS package's pin changes, add a manual check per affected
#                    connection type for each of these areas the type supports
#   manual           extra manual checks, [{ area = "...", reason = "..." }]
[packages]
# --- requirements.in
agent-base = { scope = "runtime", imports = [] }  # provides apollo.common, imported everywhere
azure-identity = { scope = "direct", imports = ["azure.identity"] }
azure-core = { scope = "transitive", imports = ["azure.core"] }
azure-keyvault-secrets = { scope = "direct", imports = ["azure.keyvault"] }
azure-mgmt-storage = { scope = "direct", imports = ["azure.mgmt.storage"] }
azure-storage-blob = { scope = "direct", imports = ["azure.storage.blob"] }
brotli = { scope = "transitive" }
cachetools = { scope = "direct" }
cerberus = { scope = "direct" }
click = { scope = "transitive" }
clickhouse-connect = { scope = "direct", connection_types = ["clickhouse"], areas = ["metadata_collection", "query_logs", "monitors"] }
cryptography = { scope = "direct" }
databricks-sql-connector = { scope = "direct", imports = ["databricks.sql"], connection_types = ["databricks-sql-warehouse", "databricks-metastore-sql-warehouse"], areas = ["metadata_collection", "query_logs", "monitors"] }
databricks-sdk = { scope = "direct", imports = ["databricks.sdk"], connection_types = ["databricks-sql-warehouse", "databricks-metastore-sql-warehouse"], areas = ["metadata_collection", "query_logs"] }
duckdb = { scope = "direct", connection_types = ["motherduck"], areas = ["metadata_collection", "monitors"] }
flask = { scope = "runtime", imports = [] }
flask-compress = { scope = "runtime", imports = [] }
google-api-python-client = { scope = "direct", imports = ["googleapiclient"], connection_types = ["bigquery"], areas = ["metadata_collection", "query_logs", "monitors"] }
google-cloud-dataform = { scope = "direct", imports = ["google.cloud.dataform", "google.cloud.dataform_v1", "google.cloud.dataform_v1beta1"], connection_types = ["gcp-dataform"], areas = ["metadata_collection"] }
google-cloud-secret-manager = { scope = "direct", imports = ["google.cloud.secretmanager", "google.cloud.secretmanager_v1"] }
google-cloud-storage = { scope = "direct", imports = ["google.cloud.storage"] }
grpcio = { scope = "transitive", imports = ["grpc"] }
google-auth-httplib2 = { scope = "direct", connection_types = ["bigquery"], areas = ["metadata_collection", "query_logs", "monitors"] }  # BigQuery HTTP transport
httplib2 = { scope = "direct", connection_types = ["bigquery"], areas = ["metadata_collection", "query_logs", "monitors"] }  # BigQuery HTTP transport
httpcore = { scope = "direct" }
httpx = { scope = "direct" }
gunicorn = { scope = "runtime", imports = [] }
hdbcli = { scope = "direct", connection_types = ["sap-hana"], areas = ["metadata_collection", "monitors"] }
ibm-db = { scope = "direct", imports = ["ibm_db", "ibm_db_dbi"], connection_types = ["db2"], areas = ["metadata_collection", "monitors"] }
jinja2 = { scope = "direct" }
lxml = { scope = "transitive" }
lambda-git = { scope = "direct", imports = [], connection_types = ["looker-git-clone"] }  # git binary for the Lambda image
looker-sdk = { scope = "direct", connection_types = ["looker"], areas = ["metadata_collection"] }
mcp = { scope = "direct" }
msal = { scope = "direct", connection_types = ["power-bi"] }
numpy = { scope = "transitive" }
oracledb = { scope = "direct", connection_types = ["oracle"], areas = ["metadata_collection", "monitors"], manual = [{ area = "other", reason = "Oracle runs in thin and thick mode: validate a thick-mode Oracle connection (with TLS) on the AWS and Azure test agents and a thin-mode one on the GCP test agent" }] }
