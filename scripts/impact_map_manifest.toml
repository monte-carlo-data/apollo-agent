"apollo/integrations/aws/athena_proxy_client.py" = { connection_types = ["athena"] }
"apollo/integrations/aws/glue_proxy_client.py" = { connection_types = ["glue"] }
"apollo/integrations/aws/s3_proxy_client.py" = { connection_types = ["s3", "hive-s3"] }
