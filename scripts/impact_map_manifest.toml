"apollo/integrations/aws/aws_utils.py" = { connection_types = ["athena", "glue", "s3", "hive-s3"] }
"apollo/integrations/aws/msk_proxy_client.py" = { manual = "MSK Connect / MSK Kafka ETL collection has no REST v2 connection type: run an ETL collection on an MSK connection" }
"apollo/integrations/bigquery/" = { connection_types = ["bigquery"] }
"apollo/integrations/databricks/" = { connection_types = ["databricks-sql-warehouse", "databricks-metastore-sql-warehouse"] }
